# TEMPORARY (Phase 5): prove the GitHub OIDC sub claim, the AWS role trust, and the EKS
# namespace scoping before any deploy relies on them. Run once, record the output, delete.
name: oidc-whoami

on:
  workflow_dispatch:

permissions: {}

jobs:
  whoami:
    runs-on: ubuntu-24.04
    environment: debug        # without this the sub claim has no environment and the trust fails
    permissions:
      id-token: write
      contents: read
    env:
      EXPECTED_SUB_PATTERN: "repo:sockstabby@17520257/*:environment:debug"
    steps:
      - name: Print OIDC claims (never the token)
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::${token}"
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims=$(printf '%s' "$payload" | base64 -d)
          echo "$claims" | jq '{sub, aud, environment, repository, repository_id, repository_owner_id, job_workflow_ref, ref}'
          sub=$(echo "$claims" | jq -r .sub)
          # Same * semantics as IAM StringLike for this pattern.
          # shellcheck disable=SC2053
          if [[ "$sub" == $EXPECTED_SUB_PATTERN ]]; then
            echo "sub matches trust pattern: $EXPECTED_SUB_PATTERN"
          else
            echo "::error::sub '$sub' does not match '$EXPECTED_SUB_PATTERN'"; exit 1
          fi

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: oidc-whoami-${{ github.run_id }}

      - name: AWS identity and cluster
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws eks describe-cluster --name "$CLUSTER" --query 'cluster.{name:name,version:version,status:status}'
          aws eks update-kubeconfig --name "$CLUSTER" --region us-east-2

      - name: Kubernetes permissions (expect apps=yes, elsewhere=no)
        run: |
          set +e -uo pipefail   # can-i exits 1 for "no"; compare its output instead
          check() { # expected verb resource namespace
            got=$(kubectl auth can-i "$2" "$3" -n "$4" 2>/dev/null || true); got=${got:-no}
            printf '%-4s %-7s %-12s -n %-12s (expected %s)\n' "$got" "$2" "$3" "$4" "$1"
            [ "$got" = "$1" ] || fail=1
          }
          fail=0
          check yes create deployments apps
          check yes create secrets     apps
          check no  create deployments default
          check no  get    secrets     kube-system
          check no  create namespaces  default
          exit $fail
